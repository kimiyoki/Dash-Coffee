<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashCoffee - Point of Sale & Inventory Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="feedback.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <span class="coffee-icon">☕</span>
                <span class="logo-text">DASHCOFFEE</span>
            </div>
            <nav class="navbar-menu">
                <a href="#home" class="nav-link" data-page="home">Home</a>
                <a href="#menu" class="nav-link" data-page="menu">Menu</a>
                <a href="#contact" class="nav-link" data-page="contact">Contact</a>
                <a href="#feedback" class="nav-link" data-page="feedback">Feedback</a>
                <a href="#login" class="nav-link nav-logout" data-page="login">Logout</a>
            </nav>
            <button class="navbar-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Main View Container -->
    <main id="app-container">
        <!-- Views will be dynamically loaded here -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 DashCoffee. All rights reserved.</p>
            <div class="footer-links">
                <a href="#" class="footer-link">Privacy Policy</a>
                <a href="#" class="footer-link">Terms of Service</a>
                <a href="#" class="footer-link">Contact Us</a>
            </div>
        </div>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script src="home.js"></script>
    <script src="menu.js"></script>
    <script src="contact.js"></script>
    <script src="feedback.js"></script>
    <script src="login.js"></script>
</body>
</html>
